[package]
name = "hyperion-core"
description = "Shared primitives for the Hyperion router: decimal conversion, Stellar address encoding, flow-limit accounting, and error codes."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = "1"
